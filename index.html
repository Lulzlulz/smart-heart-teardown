<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Smart Heart Teardown — an interactive 3D cardiac cycle you can take apart. Every pressure, volume and heart sound is calculated live by a physiology model. English, Русский, O'zbekcha." />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<meta property="og:title" content="Smart Heart Teardown · The Cardiac Cycle">
<meta property="og:description" content="A 3D heart you can take apart. Every pressure, volume and heart sound is calculated live. EN · RU · UZ">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<title>Smart Heart Teardown · The Cardiac Cycle</title>
</head>
<body>
<header>
  <div class="brand"><b>SMART <span>HEART</span></b><small id="subtitle"></small></div>
  <div class="hright">
    <div class="seg" id="langs"><button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="uz">UZ</button></div>
    <div class="seg" id="modes"><button data-m="basic" id="mBasic"></button><button data-m="adv" id="mAdv"></button></div>
    <button id="soundBtn" class="pill"></button><button id="notesBtn" class="pill"></button>
  </div>
</header>
<nav id="presets"></nav>
<main id="main" class="basic">
  <div id="left">
  <section id="stage">
    <div id="view"><div id="labels"></div><div class="hint" id="hint"></div></div>
    <div id="toolbar">
      <div class="grp" id="speed"></div>
      <div class="grp"><label class="sl"><span id="tExplode"></span><input id="explode" type="range" min="0" max="1" step="0.01" value="0.45"></label>
        <button id="cutBtn" class="pill on"></button><button id="flowBtn" class="pill on"></button><button id="labBtn" class="pill on"></button></div>
    </div>
    <div id="strip">
      <canvas id="timeline"></canvas>
      <div id="phaseLine"><b id="phName"></b><span id="phShort"></span><button id="moreBtn" class="link"></button></div>
      <div id="phLong" class="hidden"></div>
    </div>
  </section>
  <section id="wigWrap"><div class="ctitle" id="tWig"></div><canvas id="wiggers"></canvas></section>
  </div>
  <aside id="side">
    <div class="presetnote" id="presetNote"></div>
    <div class="readouts" id="readouts"></div>
    <section id="pvWrap" class="adv-only"><div class="ctitle" id="tPv"></div><canvas id="pv"></canvas></section>
    <div class="controls adv-only" id="controls"></div>
  </aside>
</main>
<div id="notes" class="modal hidden"><div class="mbox" id="notesBox"></div></div>
<script type="module" src="/app.js"></script>
</body>
</html>
